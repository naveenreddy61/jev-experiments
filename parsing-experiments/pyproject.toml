[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jev-eval"
version = "0.1.0"
description = "Atomic yes/no capability-frontier eval suite for TypeSafe AI's Jev model"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = []
# The Jev provider talks to TypeSafe System One through the official SDK.
# The LLM baselines stay stdlib-only, so this is an extra, not a hard dep.
jev = ["typesafe_sdk>=0.7"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.unittest]
# Tests are stdlib unittest; run with:
#   PYTHONPATH=src python -m unittest discover -s tests -v
